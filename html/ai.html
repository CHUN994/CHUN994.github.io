<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI助手 | 铁路主题网站</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .chat-container {
            max-width: 800px;
            margin: 30px auto;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 20px;
            height: 600px;
            display: flex;
            flex-direction: column;
        }
        #chatBox {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 10px;
        }
        .chat-item {
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .user-say {
            color: #00ffcc;
            text-align: right;
        }
        .ai-say {
            color: #fff;
            text-align: left;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        #userText {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background: #00ffcc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #00ddaa;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">铁路风采</div>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="system-chewu.html">车务</a></li>
                <li><a href="system-jiwu.html">机务</a></li>
                <li><a href="system-gongwu.html">工务</a></li>
                <li><a href="system-dianwu.html">电务</a></li>
                <li><a href="system-cheliang.html">车辆</a></li>
                <li><a href="life-photo.html">图文纪实</a></li>
                <li><a href="ai.html" class="active">AI助手</a></li>
                <li><a href="about-us.html">关于我们</a></li>
            </ul>
        </div>
    </header>

    <div class="chat-container">
        <div id="chatBox">
            <div class="chat-item ai-say">AI助手：您好！我是铁路专属智能助手，请问您想了解哪方面的知识呢？</div>
        </div>
        <div class="input-area">
            <input type="text" id="userText" placeholder="输入问题按下回车或点击发送">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <footer>
        <p>© 2026 铁路主题课程作业 | 版权所有</p>
    </footer>

<script>
let isLoading = false;
async function sendMsg() {
    if (isLoading) return;
    let text = document.getElementById("userText").value.trim();
    if (!text) return;
    let box = document.getElementById("chatBox");
    box.innerHTML += `<div class="chat-item user-say">我：${text}</div>`;
    document.getElementById("userText").value = "";
    let tip = document.createElement("div");
    tip.className = "chat-item ai-say";
    tip.innerText = "AI正在思考中...";
    box.appendChild(tip);
    box.scrollTop = box.scrollHeight;
    isLoading = true;
    try{
        let res = await fetch("https://api.deepseek.com/v1/chat/completions",{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer sk-c009ae27211b4ba9bc200b4cf22f8672"
            },
            body:JSON.stringify({
                model:"deepseek-chat",
                messages:[
                    {role:"system",content:"你是铁路专业答疑助手，简洁专业回答问题"},
                    {role:"user",content:text}
                ]
            })
        });
        box.removeChild(tip);
        let data = await res.json();
        box.innerHTML += `<div class="chat-item ai-say">AI助手：${data.choices[0].message.content}</div>`;
    }catch{
        box.removeChild(tip);
        box.innerHTML += `<div class="chat-item ai-say">AI助手：请求出错</div>`;
    }
    isLoading = false;
    box.scrollTop = box.scrollHeight;
}
document.getElementById("userText").onkeydown=e=>{if(e.key=="Enter")sendMsg();}
</script>
</body>
</html>
